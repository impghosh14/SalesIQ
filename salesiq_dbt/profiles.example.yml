salesiq:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: YOUR_ACCOUNT_IDENTIFIER
      user: YOUR_USER
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: YOUR_ROLE
      database: SALESIQ
      warehouse: YOUR_WAREHOUSE
      schema: DBT_DEV
      threads: 4
      client_session_keep_alive: false
