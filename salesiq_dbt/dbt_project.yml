name: salesiq
version: '1.0.0'
config-version: 2
profile: salesiq

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  salesiq:
    bronze:
      +schema: BRONZE
      +materialized: view
      +tags: ["bronze"]
    silver:
      +schema: SILVER
      +materialized: view
      +tags: ["silver"]
    gold:
      +schema: GOLD
      +materialized: table
      +tags: ["gold"]
